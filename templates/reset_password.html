<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | AgriGuard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(20, 70, 35, 0.72),
                    rgba(20, 70, 35, 0.72)
                ),
                linear-gradient(135deg, #e8f5e9, #c8e6c9);

            padding: 20px;
        }

        /* Main Card */
        .reset-card {
            width: 100%;
            max-width: 430px;

            background: #ffffff;
            padding: 40px 38px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.18);

            text-align: center;

            animation: fadeIn 0.5s ease;
        }

        /* Logo / Icon */
        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #e8f5e9;

            border-radius: 50%;

            font-size: 32px;
        }

        /* Title */
        h2 {
            color: #1b5e20;
            font-size: 27px;
            margin-bottom: 10px;
        }

        /* Description */
        .description {
            color: #777;
            font-size: 14px;
            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* Form */
        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;

            color: #333;

            font-size: 14px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        /* Password Input */
        input[type="password"] {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d5d5d5;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition: all 0.25s ease;

            background: #fafafa;
        }

        input[type="password"]:focus {
            border-color: #43a047;

            background: #ffffff;

            box-shadow:
                0 0 0 3px rgba(67, 160, 71, 0.12);
        }

        /* Password Hint */
        .password-hint {
            margin-top: 7px;

            font-size: 12px;

            color: #888;
        }

        /* Button */
        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background: #2e7d32;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.25s ease;
        }

        button:hover {
            background: #1b5e20;

            transform: translateY(-1px);

            box-shadow:
                0 5px 15px rgba(46, 125, 50, 0.25);
        }

        button:active {
            transform: translateY(0);
        }

        /* AgriGuard Branding */
        .brand {
            margin-top: 25px;

            font-size: 13px;

            color: #999;
        }

        .brand strong {
            color: #2e7d32;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile */
        @media (max-width: 480px) {

            .reset-card {
                padding: 32px 24px;
            }

            h2 {
                font-size: 24px;
            }

            .logo {
                width: 60px;
                height: 60px;
                font-size: 27px;
            }
        }
    </style>

</head>

<body>

    <div class="reset-card">

        <div class="logo">
            🌱
        </div>

        <h2>Create New Password</h2>

        <p class="description">
            Enter a new password for your AgriGuard account.
            Make sure your password is strong and secure.
        </p>

        <form method="POST">

            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your new password"
                    required
                >

                <p class="password-hint">
                    Choose a password that is difficult for others to guess.
                </p>

            </div>

            <button type="submit">
                Change Password
            </button>

        </form>

        <div class="brand">
            Powered by <strong>AgriGuard</strong> 🌿
        </div>

    </div>

</body>

</html>
