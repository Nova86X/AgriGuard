<!DOCTYPE html>

<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Forgot Password
    </title>

    <style>

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f2f7f2;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }


        .card {

            width: 400px;

            max-width: 90%;

            background: white;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            box-shadow: 0 0 15px #ccc;

        }


        h2 {

            color: #2e7d32;

            margin-bottom: 20px;

        }


        .description {

            color: #555;

            margin-bottom: 20px;

        }


        input {

            width: 90%;

            padding: 12px;

            margin: 10px 0;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 15px;

            box-sizing: border-box;

        }


        input:focus {

            outline: none;

            border-color: #2e7d32;

        }


        /* BUTTON CONTAINER */

        .button-group {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-top: 15px;

        }


        /* COMMON BUTTON STYLE */

        .btn {

            display: inline-block;

            padding: 11px 20px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;

            text-decoration: none;

            border: none;

            cursor: pointer;

            transition: 0.3s;

        }


        /* CONTINUE BUTTON */

        .continue-btn {

            background: #2e7d32;

            color: white;

        }


        .continue-btn:hover {

            background: #1b5e20;

            transform: translateY(-2px);

        }


        /* BACK TO LOGIN BUTTON */

        .back-btn {

            background: #e0e0e0;

            color: #333;

        }


        .back-btn:hover {

            background: #cfcfcf;

            transform: translateY(-2px);

        }


        @media (max-width: 768px) {

            .card {

                width: 90%;

                padding: 25px;

                box-sizing: border-box;

            }


            .button-group {

                flex-direction: column;

            }


            .btn {

                width: 100%;

                box-sizing: border-box;

            }

        }

    </style>

</head>


<body>


<div class="card">


    <h2>
        🔐 Forgot Password
    </h2>


    <p class="description">
        Enter your email or phone
    </p>


    <form method="POST">


        <input

            type="text"

            name="login"

            placeholder="Email or Phone Number"

            required

        >


        <div class="button-group">


            <!-- BACK TO LOGIN -->

            <a

                href="/login"

                class="btn back-btn"

            >

                ← Back to Login

            </a>


            <!-- CONTINUE -->

            <button

                type="submit"

                class="btn continue-btn"

            >

                Continue →

            </button>


        </div>


    </form>


</div>


</body>

</html>
