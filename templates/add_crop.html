<!DOCTYPE html>

<html>


<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Add New Crop - AgriGuard
</title>


<style>


body {

    margin:0;

    font-family:

    "Noto Sans Myanmar",
    "Pyidaungsu",
    "Myanmar Text",
    Arial,
    sans-serif;

    background:#f2f7f2;

}



.container{

    width:90%;

    max-width:420px;

    background:white;

    margin:50px auto;

    padding:30px;

    border-radius:15px;

    box-shadow:0px 0px 12px #ccc;

}



h1 {


    text-align:center;

    color:#2e7d32;


}



label {


    font-weight:bold;

    display:block;

    margin-top:15px;


}



input, select {


    width:100%;

    padding:12px;

    margin-top:8px;

    border-radius:8px;

    border:1px solid #ccc;

    font-size:15px;

    box-sizing:border-box;


}



.container button {


    width:100%;

    margin-top:25px;

    padding:12px;

    background:#2e7d32;

    color:white;

    border:none;

    border-radius:8px;

    font-size:16px;

    cursor:pointer;


}



.container button:hover {


    background:#1b5e20;


}



.back {


    display:block;

    text-align:center;

    margin-top:15px;

    color:#2e7d32;

    text-decoration:none;


}

@media (max-width:768px){

.container,
.profile-container,
.login-card,
.register-card{

    width:90%;

}

}

</style>


</head>



<body>



{% include "navbar.html" %}




<div class="container">



<h1>
🌱 {{lang.add_crop}}
</h1>

<p style="text-align:center;">
{{lang.manage_crops}}
</p>


<form method="POST">



<label>
    {{ lang.crop_name }}
</label>

<input
    type="text"
    name="crop_name"
    placeholder="{% if session.get('language', 'en') == 'mm' %}ဥပမာ - ခရမ်းချဉ်သီး{% else %}Example: Tomato{% endif %}"
    required
>

<label>
    {{ lang.planting_date }}
</label>

<input
    type="date"
    name="date"
    required
>
<label>
    {{ lang.growth_stage }}
</label>

<select name="stage" required>

    <option value="">
        {{ lang.select_growth_stage }}
    </option>

    <option value="Seedling">
        {{ lang.seedling }}
    </option>

    <option value="Vegetative">
        {{ lang.vegetative }}
    </option>

    <option value="Flowering">
        {{ lang.flowering }}
    </option>

    <option value="Fruiting">
        {{ lang.fruiting }}
    </option>

    <option value="Harvest">
        {{ lang.harvest }}
    </option>

</select>
<label>
    {{ lang.status }}
</label>

<select name="status" required>

    <option value="">
        {{ lang.select_status }}
    </option>

    <option value="Healthy">
        {{ lang.healthy }}
    </option>

    <option value="Infected">
        {{ lang.infected }}
    </option>

</select>




<button type="submit">

Save Crop 🌱

</button>



</form>




<a class="back" href="/crops">

⬅ Back to My Crops

</a>



</div>

<script src="{{ url_for('static', filename='js/navbar.js') }}"></script>
</body>



</html>
