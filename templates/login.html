<!DOCTYPE html>

<html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
AgriGuard - Login
</title>

<style>

body {

    margin:0;
    font-family:Arial;

    background:
    linear-gradient(
    rgba(46,125,50,0.8),
    rgba(46,125,50,0.8)
    ),
    url('/static/images/farm.jpg');

    background-size:cover;

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

}



.login-card {


    background:white;

    width:90%;

    max-width:380px;

    padding:40px;

    border-radius:20px;

    box-shadow:0 10px 30px #555;

    text-align:center;


}



.logo {

    font-size:55px;

}



h1 {


    color:#2e7d32;

    margin:5px;


}



.subtitle {


    color:#666;

    margin-bottom:30px;


}



input {


    width:90%;

    padding:14px;

    margin:10px;

    border-radius:10px;

    border:1px solid #ccc;

    font-size:15px;

    box-sizing:border-box;

    transition:.3s;


}



input:focus {


    outline:none;

    border-color:#2e7d32;


}




button {


    width:95%;

    padding:14px;

    margin-top:15px;

    background:#2e7d32;

    color:white;

    border:none;

    border-radius:10px;

    font-size:16px;

    cursor:pointer;

    box-sizing:border-box;

    transition:.3s;


}



button:hover {


    background:#1b5e20;

    transform:scale(1.03);


}




a {


    color:#2e7d32;

    text-decoration:none;

    font-weight:bold;


}



.home {


    margin-top:20px;


}

@media (max-width:768px){

.container,
.profile-container,
.login-card,
.register-card{

    width:90%;

}

}


</style>


</head>


<body>



<div class="login-card">


<div class="logo">
🌱 AgriGuard
</div>


<h1>
AgriGuard
</h1>


<p class="subtitle">

Smart Agriculture System

</p>




<form method="POST">



<input

type="text"

name="login"

placeholder="Email or Phone"

required

>



<input

type="password"

name="password"

placeholder="Password"

required

>



<button>

Login

</button>


</form>




<br>


<a href="/forgot_password">

Forgot Password?

</a>


<p>

Don't have an account?

<a href="/register">

Register

</a>

</p>



<div class="home">

<a href="/">

🏠 Back Home

</a>

</div>



</div>



</body>

</html>
